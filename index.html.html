<style>
:root{
  --bg:#ffffff;--card:#ffffff;--card2:#f5f5f5;--line:#e6e6e6;--text:#111111;--muted:#737373;
  --green:#15803d;--red:#dc2626;--amber:#b45309;--blue:#1d4ed8;--grey:#c4c4c4;--accent:#111111;--onaccent:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;font-weight:400;-webkit-font-smoothing:antialiased}
/* No scroll bars anywhere */
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
body{padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 88px);overflow-x:hidden;word-wrap:break-word;overflow-wrap:break-word}
h1{font-weight:600;font-size:20px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h2{font-size:13px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.tag{font-size:12px;font-weight:500;background:var(--card2);color:var(--muted);padding:5px 10px;border-radius:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{white-space:nowrap;font-size:21px;font-weight:500;margin-top:2px}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em}
.pos{color:var(--green)}.neg{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:20px;font-size:13px;font-weight:500}
.chip.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--text);width:40px;height:36px;border-radius:10px;font-size:18px}
.nav .lbl{font-weight:500;text-align:center;flex:1}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;font-size:16px;font-family:inherit}
textarea{resize:none;min-height:60px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:500;background:var(--accent);color:var(--onaccent);margin-top:14px}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:64px;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:10px 6px;border-radius:10px;font-weight:400;font-size:14px}
.seg button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.preview{background:var(--card2);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.6}
.bet{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--grey);border-radius:12px;padding:12px;margin-bottom:8px}
.bet.won{border-left-color:var(--green)}.bet.placed{border-left-color:var(--blue)}.bet.lost{border-left-color:var(--red)}.bet.pending{border-left-color:var(--amber)}
.bet .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bet .sel{font-weight:600;font-size:16px}
.bet .meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.bet .pl{flex-shrink:0;font-weight:600;font-size:16px;white-space:nowrap;text-align:right}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted);text-transform:uppercase}
.badge.won{color:var(--green)}.badge.placed{color:var(--blue)}.badge.lost{color:var(--red)}.badge.pending{color:var(--amber)}
.settle{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.settle button{flex:1;min-width:60px;padding:9px 4px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:500;font-size:13px}
.settle .w{color:var(--green)}.settle .p{color:var(--blue)}.settle .l{color:var(--red)}
.day{font-size:13px;font-weight:500;color:var(--muted);margin:16px 0 6px;display:flex;justify-content:space-between}
.bk{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bk .name{font-weight:600;font-size:16px}
.bk .bal{white-space:nowrap;flex-shrink:0;font-size:20px;font-weight:500;text-align:right}
.small{font-size:12px;color:var(--muted)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#ffffff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:10}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;font-weight:400;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--accent)}
.tabbar .add.on{color:var(--onaccent)}
.tabbar .add{color:var(--onaccent)}
.tabbar .add span.c{background:var(--accent);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.tabbar .add span.c svg{width:26px;height:26px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;line-height:1.5}
.tbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.tbl td,.tbl th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;word-break:break-word}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase}
.chart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:500;font-size:14px;padding:4px 0}
.txn{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px solid var(--line);gap:8px}
details summary{cursor:pointer;color:var(--accent);font-weight:500;text-decoration:underline;font-size:13px;margin-top:8px;list-style:none}

button{font-family:inherit}
strong{font-weight:600}

.types button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}

.leg{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.leg:first-of-type{border-top:0;margin-top:0;padding-top:0}
.legno{font-size:13px;font-weight:500}
.tabbar button{min-width:0}
.xtag{display:inline-block;font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted);vertical-align:middle}
.hedge{display:block;width:100%;margin-top:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--text)}
input.xback{background:#e3f1ff;border-color:#b6dbff}
input.xlay{background:#fde8ec;border-color:#f7c3cd}
.verdict{border-radius:14px;padding:16px;margin-bottom:10px;color:#fff;background:#111;line-height:1.45;font-size:14px}
.verdict.lay{background:#15803d}.verdict.back{background:#1d4ed8}
.verdict .vword{font-size:26px;font-weight:600;letter-spacing:.04em;margin-bottom:4px}
.verdict .vsub{margin-top:8px;opacity:.85;font-size:13px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.opt.best{border:2px solid #111}

.lres button{min-width:0;padding:9px 2px;font-size:13px}
select.lpf{flex:0 0 84px}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const LOGO="<svg class=\"logo\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 512 512\"> <rect width=\"512\" height=\"512\" fill=\"#111111\"/> <g fill=\"#ffffff\" stroke=\"#ffffff\" stroke-linejoin=\"round\" stroke-linecap=\"round\"> <path d=\"M168 250 C138 236 104 240 70 270 C98 262 120 266 150 276 Z\" stroke-width=\"6\"/> <path d=\"M160 262 C170 226 230 214 290 222 C320 226 338 236 350 252 C352 282 336 300 300 304 C262 308 236 300 214 304 C186 306 160 296 160 262 Z\" stroke=\"none\"/> <path d=\"M296 230 C318 208 344 186 374 168 C388 160 400 164 404 176 C392 196 378 220 352 262 Z\" stroke=\"none\"/> <path d=\"M370 166 C384 152 404 150 418 160 C430 170 440 186 444 198 C446 206 438 210 430 206 C418 200 404 192 392 186 Z\" stroke=\"none\"/> <path d=\"M378 162 L382 140 L392 158 Z\" stroke-width=\"4\"/> <path d=\"M330 286 L364 316 L400 306 L410 314 L368 334 L318 302 Z\" stroke-width=\"6\"/> <path d=\"M306 296 L322 342 L300 372 L292 366 L306 340 L290 300 Z\" stroke-width=\"6\"/> <path d=\"M176 280 L140 318 L100 336 L94 326 L130 304 L162 266 Z\" stroke-width=\"6\"/> <path d=\"M206 294 L224 344 L252 368 L246 376 L212 352 L192 300 Z\" stroke-width=\"6\"/> </g> <g fill=\"#ffffff\" stroke=\"#111111\" stroke-width=\"7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"> <path d=\"M242 232 C238 214 256 198 284 192 C300 189 314 192 320 200 C322 210 314 214 304 214 L336 226 C342 229 340 238 332 236 L296 226 C286 232 276 236 268 236 L282 254 C286 262 278 266 272 260 L252 240 C248 238 244 236 242 232 Z\"/> <circle cx=\"326\" cy=\"184\" r=\"17\"/> </g> <path d=\"M310 180 C314 166 336 164 342 178 Z\" fill=\"#111111\"/> <path d=\"M70 420 H442\" stroke=\"#ffffff\" stroke-width=\"6\" stroke-linecap=\"round\" opacity=\".3\"/> </svg>";
/* ============ HELPERS ============ */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;
const money=n=>(n<0?'-':'')+'£'+Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const smoney=n=>(n>0?'+':'')+money(n);
const pts=n=>{const v=Math.round(n*100)/100;return (v>0?'+':'')+v.toLocaleString('en-GB',{maximumFractionDigits:2})+(Math.abs(v)===1?'pt':'pts')};
const plp=(pl,p)=>`${smoney(r2(pl))} (${pts(p)})`;
const cls=n=>n>0.004?'pos':n<-0.004?'neg':'';
const iso=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const fmtDate=s=>{const d=new Date(s+'T12:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2000)}
function frac(str){if(!str)return 0;const s=String(str).trim();if(s.includes('/')){const[a,b]=s.split('/').map(Number);return b?a/b:0}return Number(s)||0}
/* Odds: accepts 5/1, 11/4, evs/evens, or decimal like 6.0 */
function parseOdds(str){
  if(str==null)return null;const s=String(str).trim().toLowerCase();
  if(!s)return null;
  if(s==='evs'||s==='evens'||s==='ev'||s==='e')return 2;
  if(s.includes('/')){const[a,b]=s.split('/').map(Number);if(a>0&&b>0)return 1+a/b;return null}
  const n=Number(s);return n>1?n:null;
}

/* ============ BET TYPES ============
   n = number of selections. min = smallest combination included
   ('all' = one line using every selection). */
const BET_TYPES=[
  {id:'single',  name:'Single',     n:1,min:'all'},
  {id:'double',  name:'Double',     n:2,min:'all'},
  {id:'treble',  name:'Treble',     n:3,min:'all'},
  {id:'acca',    name:'Accumulator',n:4,min:'all',variable:true},
  {id:'trixie',  name:'Trixie',     n:3,min:2},
  {id:'patent',  name:'Patent',     n:3,min:1},
  {id:'yankee',  name:'Yankee',     n:4,min:2},
  {id:'lucky15', name:'Lucky 15',   n:4,min:1},
  {id:'canadian',name:'Canadian',   n:5,min:2},
  {id:'lucky31', name:'Lucky 31',   n:5,min:1},
  {id:'heinz',   name:'Heinz',      n:6,min:2},
  {id:'lucky63', name:'Lucky 63',   n:6,min:1},
];
const typeOf=id=>BET_TYPES.find(t=>t.id===id)||BET_TYPES[0];
function combos(n,k){const out=[];const rec=(s,c)=>{if(c.length===k){out.push(c.slice());return}for(let i=s;i<n;i++){c.push(i);rec(i+1,c);c.pop()}};rec(0,[]);return out}
function linesOf(b){const t=typeOf(b.type),n=b.legs.length,min=t.min==='all'?n:t.min;let L=[];for(let k=min;k<=n;k++)L=L.concat(combos(n,k));return L}
const lineCount=b=>linesOf(b).length;
const legName=(l,i,n)=>l.name||(n>1?'Selection '+(i+1):'Selection');
const legRace=l=>[l.time,l.course].filter(Boolean).join(' ');
const isLay=b=>b&&b.kind==='lay';
const num=v=>Number(String(v??'').replace(/[£,\s]/g,''))||0;
const layLiab=b=>r2(num(b.layStake)*Math.max(0,num(b.layOdds)-1));
const layWin=b=>r2(num(b.layStake)*(1-num(b.comm)/100));
function typeLabel(b){if(isLay(b))return 'Lay';const t=typeOf(b.type);return t.id==='acca'?`${b.legs.length}-fold Acca`:t.name}

/* ============ BET MATHS ============
   unit = stake per line, per way. Each bet keeps its own point value (ppv),
   e/w rule and points mode forever — settings only affect new bets. */
function unit(b){
  if(isLay(b))return 0;
  const base=b.points*b.ppv,perLine=b.ptsMode==='total'?base/lineCount(b):base;
  return b.ew?(b.ewMode==='perway'?perLine:perLine/2):perLine;
}
function betStake(b){if(isLay(b))return layLiab(b);return r2(unit(b)*lineCount(b)*(b.ew?2:1))}
const legWin=l=>l.result==='won'?(l.dec||0):l.result==='void'?1:0;
const legPlace=l=>(l.result==='won'||l.result==='placed')?1+((l.dec||1)-1)*frac(l.placeFrac):l.result==='void'?1:0;
const betPending=b=>b.legs.some(l=>l.result==='pending');
const settled=b=>!betPending(b);
const hasOverride=b=>b.retOverride!=null&&b.retOverride!==''&&!isNaN(+b.retOverride);
/* If the bookie paid a different amount (Rule 4, dead heat, bonus etc.)
   the actual returns entered override the calculated figure. */
function betReturns(b){if(betPending(b))return 0;return hasOverride(b)?r2(+b.retOverride):calcReturns(b)}
function calcReturns(b){
  if(betPending(b))return 0;
  if(isLay(b)){const r=b.legs[0].result;if(r==='void')return layLiab(b);if(r==='won')return 0;return r2(layLiab(b)+layWin(b))}
  const u=unit(b);let r=0;
  for(const line of linesOf(b)){
    r+=u*line.reduce((a,i)=>a*legWin(b.legs[i]),1);
    if(b.ew)r+=u*line.reduce((a,i)=>a*legPlace(b.legs[i]),1);
  }
  return r2(r);
}
function betPL(b){return betPending(b)?0:r2(betReturns(b)-betStake(b))}
function status(b){
  if(betPending(b))return 'pending';
  if(b.legs.every(l=>l.result==='void'))return 'void';
  const r=betReturns(b),s=betStake(b);
  if(isLay(b))return r>s?'won':'lost';
  if(r<=0.004)return 'lost';
  if(b.legs.length===1)return b.legs[0].result==='placed'?'placed':'won';
  return r>=s?'won':'placed';
}
const statusLabel=(st,b)=>st==='placed'&&b.legs.length>1?'Part return':st==='void'?'Void':st;

/* ============ DATA ============
   Data is kept in TWO places on the phone (localStorage + IndexedDB) and the
   browser is asked to mark storage as persistent. Every change saves instantly. */
const KEY='betTracker.v1';
const DEFAULT_COURSES=['Bath','Kempton','Newcastle','Newmarket','Pontefract','Southwell','Wolverhampton','Yarmouth'];
const defaultState={settings:{pointValue:5,placeTerms:'1/5',ewMode:'split',ptsMode:'line',commission:5,courses:DEFAULT_COURSES.slice()},bookies:[],bets:[]};
const sortCourses=a=>[...new Set(a.map(c=>String(c).trim()).filter(Boolean))].sort((x,y)=>x.localeCompare(y,'en-GB',{sensitivity:'base'}));
function addCourse(name){const n=String(name||'').trim().replace(/\s+/g,' ');if(!n)return '';
  const ex=S.settings.courses.find(c=>c.toLowerCase()===n.toLowerCase());if(ex)return ex;
  const nice=n.replace(/\b\w/g,ch=>ch.toUpperCase());S.settings.courses=sortCourses([...S.settings.courses,nice]);save();return nice}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function normalise(d){
  const s=Object.assign(structuredClone(defaultState),d||{});
  s.settings=Object.assign(structuredClone(defaultState.settings),s.settings||{});
  s.settings.courses=sortCourses(Array.isArray(s.settings.courses)&&s.settings.courses.length?s.settings.courses:DEFAULT_COURSES);
  s.bookies=Array.isArray(s.bookies)?s.bookies:[];s.bets=Array.isArray(s.bets)?s.bets:[];
  s.bets.forEach(b=>{
    // upgrade bets logged in the earlier version (one selection) to the new format
    if(!Array.isArray(b.legs)||!b.legs.length){
      b.legs=[{name:b.selection||'',course:b.event||'',time:'',odds:b.odds||'',dec:b.dec||parseOdds(b.odds),placeFrac:b.placeFrac||s.settings.placeTerms,result:b.result||'pending'}];
      b.type='single';
    }
    b.legs.forEach(l=>{if(l.name==null)l.name='';if(l.course==null)l.course='';if(l.time==null)l.time=''});
    if(b.selection&&!b.legs[0].name){b.legs[0].name=b.selection;if(b.event&&!b.legs[0].course)b.legs[0].course=b.event}
    if(!b.type)b.type='single';if(!b.ptsMode)b.ptsMode='line';if(!b.kind)b.kind='back';
    // lock: bets never read the current point value
    if(!(b.ppv>0))b.ppv=s.settings.pointValue;if(!b.ewMode)b.ewMode=s.settings.ewMode;b.locked=true;
    b.result=status(b);
  });
  return s;
}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.settings)return normalise(d)}catch(e){}return normalise(null)}
let S=load();
const IDB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('betTracker',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>res(null)}catch(e){res(null)}})},
  async get(){const db=this.db||await this.open();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})},
  async set(v){const db=this.db||await this.open();if(!db)return;try{db.transaction('kv','readwrite').objectStore('kv').put(v,'state')}catch(e){}}
};
function save(){
  S.savedAt=Date.now();const json=JSON.stringify(S);let ok=false;
  try{localStorage.setItem(KEY,json);ok=true}catch(e){}
  IDB.set(json);
  if(!ok)toast('Saved to backup storage only — export a backup');
}
async function init(){
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  try{const raw=await IDB.get();if(raw){const d=JSON.parse(raw);
    if(d&&d.settings&&(d.savedAt||0)>(S.savedAt||0)){S=normalise(d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    else if(S.savedAt)IDB.set(JSON.stringify(S));
  }else if(S.savedAt)IDB.set(JSON.stringify(S))}catch(e){}
  render();
}
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}});

/* ============ PERIODS & SUMMARY ============ */
let period={type:'all',offset:0};
function periodRange(){
  const now=new Date();now.setHours(12,0,0,0);const o=period.offset;
  if(period.type==='day'){const d=new Date(now);d.setDate(d.getDate()+o);const s=iso(d);return{start:s,end:s,label:o===0?'Today':o===-1?'Yesterday':fmtDate(s)}}
  if(period.type==='week'){const d=new Date(now);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow+o*7);const e=new Date(d);e.setDate(e.getDate()+6);
    const l=o===0?'This week':o===-1?'Last week':'w/c '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    return{start:iso(d),end:iso(e),label:l}}
  if(period.type==='month'){const d=new Date(now.getFullYear(),now.getMonth()+o,1,12);const e=new Date(d.getFullYear(),d.getMonth()+1,0,12);
    return{start:iso(d),end:iso(e),label:d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}}
  if(period.type==='year'){const y=now.getFullYear()+o;return{start:y+'-01-01',end:y+'-12-31',label:String(y)}}
  return{start:'0000-01-01',end:'9999-12-31',label:'All time'};
}
const inRange=(b,r)=>b.date>=r.start&&b.date<=r.end;
function summarise(list){
  const s={staked:0,returns:0,pl:0,ptsPL:0,ptsStaked:0,n:0,won:0,placed:0,lost:0,void:0,pending:0,pendingStake:0};
  list.forEach(b=>{
    const st=status(b),stake=betStake(b);
    if(st==='pending'){s.pending++;s.pendingStake+=stake;return}
    if(st==='void'){s.void++;return}
    const pl=betPL(b);
    s.n++;s.staked+=stake;s.returns+=betReturns(b);s.pl+=pl;s.ptsPL+=pl/b.ppv;s.ptsStaked+=stake/b.ppv;s[st]++;
  });
  s.roi=s.staked?s.pl/s.staked*100:0;s.strike=s.n?(s.won/s.n*100):0;
  return s;
}
function bookieBalance(bk){
  let bal=Number(bk.start)||0;
  (bk.txns||[]).forEach(t=>bal+=Number(t.amount)||0);
  S.bets.filter(b=>b.bookieId===bk.id).forEach(b=>{bal+=betPending(b)?-betStake(b):betPL(b)});
  return r2(bal);
}
/* When a back bet's horse is settled, any lay logged against it settles too */
function syncLays(b){if(isLay(b)){const bk=S.bets.find(x=>x.id===b.linkedTo),r=b.legs[0].result;
    if(bk&&r!=='pending'){const l=bk.legs[b.linkedLeg||0];
      if(l&&l.result==='pending'&&(r==='won'||r==='void'||(r==='lost'&&!bk.ew))){l.result=r;if(r==='won'&&!l.dec&&b.layOdds){}bk.result=status(bk);syncLays(bk)}}
    return}S.bets.forEach(x=>{if(isLay(x)&&x.linkedTo===b.id){const l=b.legs[x.linkedLeg||0];

function chartSVG(list){
  const days={};list.filter(settled).forEach(b=>{days[b.date]=(days[b.date]||0)+betPL(b)});
  const keys=Object.keys(days).sort();if(keys.length<2)return '';
  let c=0;const p=[0,...keys.map(k=>c+=days[k])];
  const W=320,H=90,mn=Math.min(...p),mx=Math.max(...p),rg=(mx-mn)||1;
  const x=i=>i/(p.length-1)*W,y=v=>H-6-((v-mn)/rg)*(H-12);
  const line=p.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="margin-top:10px">
    <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <polyline points="${line}" fill="none" stroke="${c>=0?'var(--green)':'var(--red)'}" stroke-width="2" stroke-linejoin="round"/></svg>
    <div class="small">Running P/L by day</div>`;
}

/* ============ EXCHANGE: BACK / LAY / LEAVE ============ */
let EX={mode:'have',src:'manual',stake:'',odds:'',horse:'',back:'',lay:'',comm:null,custom:'',bk:'',bodds:'',pts:'1'};
const exComm=()=>{const c=EX.comm==null||EX.comm===''?S.settings.commission:num(EX.comm);return Math.min(Math.max(c,0),99)/100};
const exBk=()=>EX.bk||((exchangeBookie()||{}).id)||'__new';
function exSource(){
  if(EX.src!=='manual'){
    const b=S.bets.find(x=>x.id===EX.src);
    if(!b||!hedgeable(b)){EX.src='manual';return exSource()}
    const i=b.legs.findIndex(l=>l.result==='pending'),l=b.legs[i];
    if(!l.dec)return{err:`No odds entered for ${esc(legName(l,i,b.legs.length))} yet — open the bet and add the odds you took (or the SP if it was a starting-price bet).`};
    const sim=r=>calcReturns({...b,retOverride:null,legs:b.legs.map((x,j)=>j===i?{...x,result:r}:x)});
    const lays=S.bets.filter(x=>isLay(x)&&x.linkedTo===b.id&&betPending(x));
    return{bet:b,leg:i,l,horse:legName(l,i,b.legs.length),stake:betStake(b),rw:sim('won'),rl:sim('lost'),rp:b.ew?sim('placed'):null,
      dec:l.dec,odds:l.odds,ew:b.ew,multi:b.legs.length>1,ppv:b.ppv,lays,
      layW:lays.reduce((a,x)=>a+layLiab(x),0),layL:lays.reduce((a,x)=>a+layWin(x),0)};
  }
  const st=num(EX.stake),d=parseOdds(EX.odds);
  if(!(st>0)||!d)return{need:true};
  return{horse:EX.horse||'Your horse',l:{name:EX.horse,course:'',time:''},stake:st,rw:st*d,rl:0,rp:null,dec:d,odds:EX.odds,ppv:S.settings.pointValue,lays:[],layW:0,layL:0};
}
function exOutcome(s,L,lo,c){return{L:r2(L),liab:r2(L*(lo-1)),
  win:r2(s.rw-s.stake-s.layW-L*(lo-1)),lose:r2(s.rl-s.stake+s.layL+L*(1-c)),place:s.rp==null?null:r2(s.rp-s.stake+s.layL+L*(1-c))}}
const outRow=(t,v)=>`<div class="orow"><span>${t}</span><span class="${cls(v)}">${smoney(v)}</span></div>`;
function optCard(title,sub,o,s,key,best){
  return `<div class="opt ${best?'best':''}"><div class="otitle">${title}${best?' <span class="xtag">Suggested</span>':''}</div>${sub?`<div class="small">${sub}</div>`:''}
    ${o.L>0?`<div class="ostake">Lay <strong>${money(o.L)}</strong> at ${s.lo} <span class="small">· liability ${money(o.liab)}</span></div>`:''}
    ${outRow(`If ${esc(s.horse)} wins`,o.win)}${o.place!=null?outRow('If it places but doesn’t win',o.place):''}${outRow(o.place!=null?'If it’s unplaced':'If it loses',o.lose)}
    ${key&&o.L>0?`<button class="btn sec" data-loglay="${key}" style="margin-top:10px">Log this lay</button>`:''}</div>`;
}
const dp=x=>(+x).toFixed(2).replace(/0$/,'');
const exBackBk=()=>EX.bbk||((S.bets.slice().reverse().find(b=>!isLay(b)&&S.bookies.some(k=>k.id===b.bookieId&&k!==exchangeBookie()))||{}).bookieId)||((S.bookies.find(b=>b!==exchangeBookie())||{}).id)||'';
/* Reads the blue/pink prices and explains what they mean */
function priceCheck(bd,eb,lo,c,took){
  if(!eb&&!lo)return '';
  const rows=[];
  if(took)rows.push(['You took',`${took.txt} = ${dp(took.dec)}`]);
  if(bd)rows.push(['Bookie',`${esc(EX.bodds)} = ${dp(bd)}`]);
  if(eb)rows.push(['Blue (back)',`${dp(eb)} · ≈${dp(1+(eb-1)*(1-c))} after ${r2(c*100)}%`]);
  if(lo)rows.push(['Pink (lay)',dp(lo)]);
  let note='';
  if(eb&&lo){
    if(lo<eb)note=`<div class="hint neg">Pink should be the same or higher than blue — check you haven't swapped them.</div>`;
    else{const mid=(eb+lo)/2,gap=(lo-eb)/eb;rows.push(['Chance of winning',`about ${Math.round(100/mid)}%`]);
      if(gap>0.1)note=`<div class="hint">⚠️ Big gap between blue and pink: the market is thin and prices can jump. Prices usually firm up closer to the off.</div>`}
  }
  return `<div class="card pcheck"><div class="otitle" style="margin-bottom:4px">Price check</div>${rows.map(([a,b])=>`<div class="orow"><span>${a}</span><span>${b}</span></div>`).join('')}${note}</div>`;
}
function exResults(){
  const c=exComm();
  if(EX.mode==='think'){
    const bd=parseOdds(EX.bodds),eb=parseOdds(EX.back),lo=parseOdds(EX.lay),p=num(EX.pts),stake=r2(p*S.settings.pointValue);
    if(!(p>0))return `<div class="card small">Enter your points.</div>`;
    if(!eb&&!lo)return `<div class="card small">Enter the Betfair <strong>blue</strong> (back) and <strong>pink</strong> (lay) prices${bd?'':', and the bookie price if you have one'}.</div>`;
    let out=priceCheck(bd,eb,lo,c);
    // 1) Guaranteed profit: bookie price bigger than the pink after commission
    if(bd&&lo&&bd*(1-c)>lo-c+1e-9){
      const L=stake*bd/(lo-c),o={L:r2(L),liab:r2(L*(lo-1)),win:r2(stake*(bd-1)-L*(lo-1)),lose:r2(-stake+L*(1-c)),place:null};
      const g=Math.min(o.win,o.lose);
      return `<div class="verdict lay"><div class="vword">BACK &amp; LAY</div><div>Coral's price (${esc(EX.bodds)} = ${dp(bd)}) is bigger than Betfair's pink (${dp(lo)}). Back <strong>${money(stake)}</strong> with the bookie and lay <strong>${money(o.L)}</strong> on Betfair to make <strong>${smoney(g)}</strong> whatever happens.</div>
        <div class="vsub">Or just back it with the bookie: ${smoney(r2(stake*(bd-1)))} if it wins, ${smoney(-stake)} if it loses.</div></div>
        ${out}
        ${optCard('Back with bookie + lay on Betfair','Guaranteed result',o,{horse:'it',lo:dp(lo)},null,true)}
        <div class="card"><label style="margin-top:0">Log to</label>
          <div class="row"><select id="x-bbk">${S.bookies.filter(b=>b!==exchangeBookie()).map(b=>`<option value="${b.id}" ${exBackBk()===b.id?'selected':''}>${esc(b.name)}</option>`).join('')||'<option value="">— no bookie —</option>'}</select>
          <select id="x-bk">${S.bookies.map(b=>`<option value="${b.id}" ${exBk()===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}<option value="__new" ${exBk()==='__new'?'selected':''}>+ Betfair Exchange</option></select></div>
          <div class="hint">Left: the bookie for the back bet. Right: your exchange account for the lay. Prices move fast, so place the lay straight after the back bet.</div>
          <button class="btn" id="x-logboth">Log both bets</button></div>`;
    }
    // 2) Back: bookie vs exchange blue
    const eff=eb?1+(eb-1)*(1-c):0,useEx=eb&&(!bd||eff>bd+1e-9);
    const rows=`${bd?outRow(`Bookie @ ${esc(EX.bodds)} — profit if it wins`,r2(stake*(bd-1))):''}${eb?outRow(`Betfair blue @ ${dp(eb)} — profit after ${r2(c*100)}%`,r2(stake*(eb-1)*(1-c))):''}`;
    if(!bd&&!eb)return `<div class="card small">Enter the Betfair <strong>blue</strong> price, or the bookie price, to see where to back it.</div>`+out;
    return `<div class="verdict back"><div class="vword">BACK ${useEx?'ON THE EXCHANGE':'WITH THE BOOKIE'}</div>
      <div>${!bd?`Betfair's blue price ${dp(eb)} is worth about ${dp(eff)} after commission. Add the bookie price to compare.`:!eb?`Add the Betfair blue price to compare with the bookie.`:useEx?`Betfair pays more, even after ${r2(c*100)}% commission.`:`The bookie price is as good or better once Betfair's commission is taken off.`}</div>
      ${bd&&lo?`<div class="vsub">No guaranteed profit here: Coral's ${dp(bd)} isn't bigger than Betfair's pink ${dp(lo)} once commission is taken off.</div>`:''}</div>
      ${out}
      ${rows?`<div class="card">${rows}<div class="hint">Stake ${money(stake)} = ${p}pt. Bookie extras like Best Odds Guaranteed or extra places aren't on the exchange win market. For each-way tips, the bookie is usually the place to bet.</div>
      <button class="btn" id="x-logback">Log this bet</button></div>`:''}`;
  }
  const s=exSource();
  if(s.err)return `<div class="card small">${s.err}</div>`;
  if(s.need)return `<div class="card small">Enter your stake and the odds you took to get started.</div>`;
  const lo=parseOdds(EX.lay),eb0=parseOdds(EX.back);
  if(!lo)return `<div class="card small">Now enter the Betfair <strong>pink</strong> (lay) price${eb0?'':' — and the blue one if you like'}. The pink price is what decides whether laying is worth it.</div>`+priceCheck(null,eb0,null,c,{txt:esc(s.odds),dec:s.dec});
  s.lo=r2(lo);
  const took=`${esc(s.odds)}${/\//.test(s.odds||'')?` (${dp(s.dec)})`:''}`,now=dp(lo);
  const leave=exOutcome(s,0,lo,c);
  const full=exOutcome(s,Math.max(0,((s.rw-s.layW)-(s.rl+s.layL))/(lo-c)),lo,c);
  const needFree=s.stake-s.rl-s.layL;
  const free=needFree>0.004?exOutcome(s,needFree/(1-c),lo,c):null;
  const cust=num(EX.custom)>0?exOutcome(s,num(EX.custom),lo,c):null;
  const locked=Math.min(full.win,full.lose,full.place==null?Infinity:full.place);
  const shortened=lo<s.dec-1e-9,eb=parseOdds(EX.back);
  let v;
  if(locked>0.004){v=`<div class="verdict lay"><div class="vword">LAY</div><div>The price has shortened from ${took} to ${now}. Lay <strong>${money(full.L)}</strong> to lock in <strong>${smoney(locked)}</strong> whatever happens.</div>
      <div class="vsub">Or leave it: ${smoney(leave.win)} if it wins, ${smoney(leave.lose)} if it loses. Lay if you'd rather have the guaranteed amount.</div></div>`}
  else{v=`<div class="verdict leave"><div class="vword">LEAVE</div><div>${shortened?`The price has only shortened slightly (${took} → ${now}). After ${r2(c*100)}% commission, laying would lock in ${smoney(locked)}.`
      :`The exchange price (${now}) is the same or bigger than you took (${took}), so laying now would lock in a loss of ${money(Math.abs(locked))}.`} Let the bet run.</div>
      ${eb&&eb>s.dec?`<div class="vsub">If you still fancy it, the exchange back price (${eb}) is bigger than you took — you could back more there.</div>`:''}</div>`}
  return v+priceCheck(null,eb,lo,c,{txt:esc(s.odds),dec:s.dec})+`
    ${s.lays.length?`<div class="card small">Already laid: ${s.lays.map(x=>`${money(num(x.layStake))} @ ${x.layOdds}`).join(', ')}. These are included in the figures below.</div>`:''}
    ${s.ew?`<div class="card small">This is each way. A lay on the win market only covers the win part, so the figures show what happens if it wins, places or is unplaced.</div>`:''}
    ${s.multi?`<div class="card small">This is the last horse running in your ${esc(typeLabel(s.bet))}. If it wins the bet returns ${money(s.rw)}; if it loses it returns ${money(s.rl)}.</div>`:''}
    ${optCard('Leave it','No exchange bet',leave,s,null,locked<=0.004)}
    ${optCard('Lock in profit',s.ew?'Same result if it wins or is unplaced — more if it only places':'Same result whatever happens',full,s,'full',locked>0.004)}
    ${free?optCard('Get your stake back','Lose nothing if it loses, keep a smaller win if it wins',free,s,'free',false):''}
    <div class="opt"><div class="otitle">Your own lay stake</div>
      <input id="x-custom" inputmode="decimal" placeholder="Lay stake £" value="${esc(EX.custom)}" style="margin-top:8px">
      <div id="x-custres">${cust?optCard('','',cust,s,'custom',false).replace('<div class="opt ">','<div>'):''}</div></div>
    <div class="card" style="margin-top:10px"><label style="margin-top:0">Log lays to</label>
      <select id="x-bk">${S.bookies.map(b=>`<option value="${b.id}" ${exBk()===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}<option value="__new" ${exBk()==='__new'?'selected':''}>+ Create “Betfair Exchange” account</option></select>
      <div class="hint">Logged lays count in your stats and the account balance, and settle automatically when you settle ${s.bet?'this bet':'the horse'}.</div></div>`;
}
function viewEx(){
  const c=r2(exComm()*100),pend=S.bets.filter(hedgeable);
  if(EX.src!=='manual'&&!pend.some(b=>b.id===EX.src))EX.src='manual';
  const opt=b=>{const i=b.legs.findIndex(l=>l.result==='pending'),l=b.legs[i];
    return `<option value="${b.id}" ${EX.src===b.id?'selected':''}>${esc(legName(l,i,b.legs.length))}${l.time?' '+esc(l.time):''} — ${esc(typeLabel(b))}${b.ew?' e/w':''} ${money(betStake(b))} @ ${esc(l.odds||'SP')} (${esc(bookieName(b.bookieId))})</option>`};
  return `<h1>Exchange <span class="tag">${c}% commission</span></h1>
  <div class="seg" id="x-mode" style="margin-bottom:10px"><button data-v="have" class="${EX.mode==='have'?'on':''}">I've backed it</button><button data-v="think" class="${EX.mode==='think'?'on':''}">Thinking of backing</button></div>
  ${EX.mode==='have'?`
  <div class="card"><label style="margin-top:0">Your bet</label>
    <select id="x-src"><option value="manual">Enter it myself</option>${pend.map(opt).join('')}</select>
    ${EX.src==='manual'?`
      <input id="x-horse" placeholder="Horse name (optional)" value="${esc(EX.horse)}" style="margin-top:10px" autocapitalize="words">
      <div class="row" style="margin-top:8px">
        <div><label style="margin-top:0">Stake £</label><input id="x-stake" inputmode="decimal" placeholder="e.g. 5" value="${esc(EX.stake)}"></div>
        <div><label style="margin-top:0">Odds you took</label><input id="x-odds" placeholder="e.g. 10/1" value="${esc(EX.odds)}"></div>
      </div>`:`<div class="hint">Your pending bets with one horse still to run appear in this list.</div>`}
  </div>
  <div class="card"><label style="margin-top:0">Exchange prices now</label>
    <div class="row">
      <div><label style="margin-top:4px">Back (blue)</label><input id="x-back" class="xback" inputmode="decimal" placeholder="optional" value="${esc(EX.back)}"></div>
      <div><label style="margin-top:4px">Lay (pink)</label><input id="x-lay" class="xlay" inputmode="decimal" placeholder="e.g. 3.0" value="${esc(EX.lay)}"></div>
    </div>
    <label>Commission %</label><input id="x-comm" inputmode="decimal" value="${EX.comm==null?S.settings.commission:esc(EX.comm)}">
  </div>`:`
  <div class="card">
    <div class="row">
      <div><label style="margin-top:0">Bookie price</label><input id="x-bodds" placeholder="optional e.g. 5/1" value="${esc(EX.bodds)}"></div>
      <div><label style="margin-top:0">Points</label><input id="x-pts" inputmode="decimal" value="${esc(EX.pts)}"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div><label style="margin-top:0">Betfair blue (back)</label><input id="x-back" class="xback" inputmode="decimal" placeholder="e.g. 6.4" value="${esc(EX.back)}"></div>
      <div><label style="margin-top:0">Betfair pink (lay)</label><input id="x-lay" class="xlay" inputmode="decimal" placeholder="e.g. 6.8" value="${esc(EX.lay)}"></div>
    </div>
    <label>Commission %</label><input id="x-comm" inputmode="decimal" value="${EX.comm==null?S.settings.commission:esc(EX.comm)}">
  </div>`}
  <div id="xres">${exResults()}</div>`;
}
function bindExResults(){
  const $=id=>document.getElementById(id);
  const cu=$('x-custom');if(cu)cu.oninput=()=>{EX.custom=cu.value;const s=exSource(),lo=parseOdds(EX.lay);
    if(!s.need&&!s.err&&lo){s.lo=r2(lo);const o=num(EX.custom)>0?exOutcome(s,num(EX.custom),lo,exComm()):null;
      $('x-custres').innerHTML=o?optCard('','',o,s,'custom',false).replace('<div class="opt ">','<div>'):'';bindLogLay()}};
  const bk=$('x-bk');if(bk)bk.onchange=()=>EX.bk=bk.value;
  const bbk=$('x-bbk');if(bbk)bbk.onchange=()=>EX.bbk=bbk.value;
  const both=$('x-logboth');if(both)both.onclick=()=>{
    const c=exComm(),bd=parseOdds(EX.bodds),lo=parseOdds(EX.lay),p=num(EX.pts),stake=p*S.settings.pointValue;if(!bd||!lo||!(p>0))return;
    const L=r2(stake*bd/(lo-c));let xk=exBk();
    if(xk==='__new'){const nb={id:uid(),name:'Betfair Exchange',start:0,txns:[]};S.bookies.push(nb);xk=nb.id;EX.bk=nb.id}
    const back=newDraft();back.id=uid();back.created=Date.now();back.bookieId=exBackBk();back.points=p;back.ptsMode='line';
    back.legs[0].odds=EX.bodds.trim();back.legs[0].dec=bd;back.notes='Backed & laid (guaranteed)';back.locked=true;back.result='pending';
    S.bets.push(back);
    S.bets.push({id:uid(),kind:'lay',date:today(),bookieId:xk,type:'single',ew:false,legs:[{name:'',course:'',time:'',odds:String(r2(lo)),dec:r2(lo),placeFrac:S.settings.placeTerms,result:'pending'}],
      layStake:L,layOdds:r2(lo),comm:r2(c*100),points:0,ptsMode:'line',ppv:S.settings.pointValue,ewMode:S.settings.ewMode,
      notes:`Lay against ${bookieName(back.bookieId)} bet`,linkedTo:back.id,linkedLeg:0,created:Date.now()+1,locked:true,result:'pending'});
    save();toast('Both bets logged — tap the back bet to add the horse name');go('bets')};
  const lb=$('x-logback');if(lb)lb.onclick=()=>{
    const c=exComm(),bd=parseOdds(EX.bodds),eb=parseOdds(EX.back),useEx=!!eb&&(!bd||1+(eb-1)*(1-c)>bd+1e-9);
    const d=newDraft();d.points=num(EX.pts)||1;
    d.legs[0].odds=useEx?String(r2(1+(eb-1)*(1-c))):EX.bodds.trim();d.legs[0].dec=parseOdds(d.legs[0].odds);
    if(useEx){const xb=exchangeBookie();if(xb)d.bookieId=xb.id;d.notes=`Exchange back @ ${eb} (odds shown after ${r2(c*100)}% commission)`}
    draft=d;draftKey='new';go('add')};
  bindLogLay();
}
function bindLogLay(){
  document.querySelectorAll('[data-loglay]').forEach(btn=>btn.onclick=()=>{
    const s=exSource(),lo=parseOdds(EX.lay),c=exComm();if(s.need||s.err||!lo)return;
    let L;const k=btn.dataset.loglay;
    if(k==='full')L=Math.max(0,((s.rw-s.layW)-(s.rl+s.layL))/(lo-c));
    else if(k==='free')L=(s.stake-s.rl-s.layL)/(1-c);
    else L=num(EX.custom);
    L=r2(L);if(!(L>0))return toast('Nothing to lay');
    let bkId=exBk();
    if(bkId==='__new'){const nb={id:uid(),name:'Betfair Exchange',start:0,txns:[]};S.bookies.push(nb);bkId=nb.id;EX.bk=nb.id}
    const l=s.l||{};
    S.bets.push({id:uid(),kind:'lay',date:s.bet?s.bet.date:today(),bookieId:bkId,type:'single',ew:false,
      legs:[{name:l.name||s.horse||'',course:l.course||'',time:l.time||'',odds:String(r2(lo)),dec:r2(lo),placeFrac:S.settings.placeTerms,result:'pending'}],
      layStake:L,layOdds:r2(lo),comm:r2(c*100),points:0,ptsMode:'line',ppv:s.ppv,ewMode:S.settings.ewMode,
      notes:s.bet?`Hedge for ${typeLabel(s.bet)}${s.bet.ew?' e/w':''} with ${bookieName(s.bet.bookieId)}`:'Hedge',
      linkedTo:s.bet?s.bet.id:null,linkedLeg:s.bet?s.leg:null,created:Date.now(),locked:true,result:'pending'});
    save();toast(`Lay logged — ${money(L)} @ ${r2(lo)}`);EX.custom='';go('bets')});
}
function bindEx(){
  const $=id=>document.getElementById(id),upd=()=>{$('xres').innerHTML=exResults();bindExResults()};
  document.querySelectorAll('#x-mode button').forEach(b=>b.onclick=()=>{if(EX.mode!==b.dataset.v){EX.mode=b.dataset.v;EX.back='';EX.lay='';EX.custom=''}render()});
  const src=$('x-src');if(src)src.onchange=()=>{EX.src=src.value;EX.custom='';render()};
  [['x-horse','horse'],['x-stake','stake'],['x-odds','odds'],['x-back','back'],['x-lay','lay'],['x-comm','comm'],['x-bodds','bodds'],['x-pts','pts']].forEach(([id,k])=>{const el=$(id);if(el)el.oninput=()=>{EX[k]=el.value;upd()}});
  bindExResults();
}

/* ============ BOOKIES ============ */
function viewBookies(){
  const total=S.bookies.reduce((a,b)=>a+bookieBalance(b),0);
  const cards=S.bookies.map(bk=>{
    const bal=bookieBalance(bk),bets=S.bets.filter(b=>b.bookieId===bk.id);
    const pl=bets.reduce((a,b)=>a+betPL(b),0),plpts=bets.reduce((a,b)=>a+betPL(b)/b.ppv,0),pend=bets.filter(betPending);
    const dep=(bk.txns||[]).reduce((a,t)=>a+Number(t.amount),0),open=openBookie===bk.id;
    return `<div class="card">
      <div class="bk" data-open="${bk.id}"><div style="min-width:0"><div class="name">${esc(bk.name)}</div>
        <div class="small">Started ${money(Number(bk.start)||0)} · <span style="white-space:nowrap">P/L <span class="${cls(pl)}">${plp(pl,plpts)}</span></span>${pend.length?` · <span style="color:var(--amber)">${pend.length} pending</span>`:''}</div></div>
        <div class="bal">${money(bal)}</div></div>
      ${open?`
        <div class="small" style="margin-top:10px">Deposits/withdrawals: ${smoney(r2(dep))} · Bets: ${bets.length}</div>
        <div class="row" style="margin-top:8px"><div><label>Amount £</label><input id="tx-amt" inputmode="decimal" placeholder="e.g. 50"></div>
        <div><label>Note</label><input id="tx-note" placeholder="optional"></div></div>
        <div class="row"><button class="btn" data-tx="in" style="margin-top:10px">Deposit</button><button class="btn sec" data-tx="out" style="margin-top:10px">Withdraw</button></div>
        ${(bk.txns||[]).slice().reverse().map(t=>`<div class="txn"><span>${fmtDate(t.date)}${t.note?' · '+esc(t.note):''}</span><span class="${cls(t.amount)}">${smoney(Number(t.amount))} <button class="linkbtn" style="color:var(--red)" data-deltx="${t.id}">✕</button></span></div>`).join('')}
        <details><summary>Edit name / starting balance</summary>
          <div class="row"><div><label>Name</label><input id="bk-name" value="${esc(bk.name)}"></div><div><label>Starting £</label><input id="bk-start" inputmode="decimal" value="${bk.start}"></div></div>
          <div class="row"><button class="btn sec" id="bk-save" style="margin-top:10px">Save</button><button class="btn danger" id="bk-del" style="margin-top:10px">Delete</button></div>
        </details>`:''}
    </div>`}).join('');
  return `<h1>Bookies <span class="tag">Bank ${money(total)}</span></h1>
  ${cards||`<div class="empty">No bookmaker accounts yet — add your first below.</div>`}
  <div class="card"><div style="font-weight:600">Add bookmaker account</div>
    <label>Name</label><input id="nb-name" placeholder="e.g. Bet365">
    <label>Starting balance £</label><input id="nb-start" inputmode="decimal" placeholder="0.00">
    <button class="btn" id="nb-add">Add bookie</button></div>
  <div class="hint">Balance = starting balance + deposits − withdrawals + settled profit/loss − stakes on pending bets. Tap a bookie to deposit, withdraw or edit.</div>`;
}
function bindBookies(){
  document.getElementById('nb-add').onclick=()=>{const n=document.getElementById('nb-name').value.trim();if(!n)return toast('Enter a name');
    S.bookies.push({id:uid(),name:n,start:Number(document.getElementById('nb-start').value)||0,txns:[]});save();toast(n+' added');render()};
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{openBookie=openBookie===el.dataset.open?null:el.dataset.open;render()});
  const bk=S.bookies.find(b=>b.id===openBookie);if(!bk)return;
  document.querySelectorAll('[data-tx]').forEach(btn=>btn.onclick=()=>{const a=Math.abs(Number(document.getElementById('tx-amt').value));if(!a)return toast('Enter an amount');
    bk.txns=bk.txns||[];bk.txns.push({id:uid(),date:today(),amount:btn.dataset.tx==='in'?a:-a,note:document.getElementById('tx-note').value.trim()});save();toast(btn.dataset.tx==='in'?'Deposit logged':'Withdrawal logged');render()});
  document.querySelectorAll('[data-deltx]').forEach(b=>b.onclick=()=>{if(confirm('Remove this transaction?')){bk.txns=bk.txns.filter(t=>t.id!==b.dataset.deltx);save();render()}});
  document.getElementById('bk-save').onclick=()=>{bk.name=document.getElementById('bk-name').value.trim()||bk.name;bk.start=Number(document.getElementById('bk-start').value)||0;save();toast('Saved');render()};
  document.getElementById('bk-del').onclick=()=>{const n=S.bets.filter(b=>b.bookieId===bk.id).length;
    if(confirm(`Delete ${bk.name}?${n?` Its ${n} bets will be kept but show no bookie.`:''}`)){S.bookies=S.bookies.filter(b=>b.id!==bk.id);S.bets.forEach(b=>{if(b.bookieId===bk.id)b.bookieId=''});openBookie=null;save();render()}};
}

/* ============ SETTINGS ============ */
function viewSettings(){
  const st=S.settings,nb=S.bets.length;
  return `<h1>Settings</h1>
  <div class="card">
    <label style="margin-top:0">Value of 1 point (£)</label>
    <input id="s-pv" inputmode="decimal" value="${st.pointValue}">
    <div class="seg" style="margin-top:8px">${[2,5,10,20,25,50].map(v=>`<button data-pv="${v}" class="${st.pointValue==v?'on':''}">£${v}</button>`).join('')}</div>
    <div class="hint">🔒 Changing this only affects <strong>new</strong> bets. ${nb?`Your ${nb} existing bet${nb===1?' is':'s are'} locked at the value ${nb===1?'it was':'they were'} placed at`:'Each bet is locked at the value it was placed at'}, so past stakes, profits and stats never change.</div>
  </div>
  <div class="card">
    <label style="margin-top:0">How "1pt e/w" is staked</label>
    <div class="seg" id="s-ew"><button data-v="split" class="${st.ewMode==='split'?'on':''}">Split: 1pt total</button><button data-v="perway" class="${st.ewMode==='perway'?'on':''}">1pt each way</button></div>
    <div class="hint">${st.ewMode==='split'?`1pt e/w = ${money(st.pointValue/2)} each way (${money(st.pointValue)} total)`:`1pt e/w = ${money(st.pointValue)} each way (${money(st.pointValue*2)} total)`}</div>
  </div>
  <div class="card">
    <label style="margin-top:0">Points on multiples (Trixie, Yankee etc.) are usually…</label>
    <div class="seg" id="s-pm"><button data-v="line" class="${st.ptsMode!=='total'?'on':''}">Per line</button><button data-v="total" class="${st.ptsMode==='total'?'on':''}">Total stake</button></div>
    <div class="hint">${st.ptsMode!=='total'?`e.g. 1pt Trixie = 4 bets × ${money(st.pointValue)} = ${money(st.pointValue*4)}`:`e.g. 1pt Trixie = ${money(st.pointValue)} spread across 4 bets`}. You can still change it on each bet.</div>
  </div>
  <div class="card">
    <label style="margin-top:0">Default each-way place terms</label>
    <div class="seg" id="s-pt">${['1/4','1/5','1/3','1/6'].map(f=>`<button data-v="${f}" class="${st.placeTerms===f?'on':''}">${f}</button>`).join('')}</div>
  </div>
  <div class="card">
    <label style="margin-top:0">Exchange commission %</label>
    <input id="s-comm" inputmode="decimal" value="${st.commission}">
    <div class="hint">Used by the Exchange tab and for new lay bets. Betfair's standard rate is usually around 5%. Check your own account for yours.</div>
  </div>
  <div class="card">
    <label style="margin-top:0">Courses (shown A–Z in the drop-down)</label>
    <div class="clist">${S.settings.courses.map(c=>`<span class="cchip">${esc(c)}<button data-delc="${esc(c)}" aria-label="Remove ${esc(c)}">✕</button></span>`).join('')||'<span class="small">No courses yet</span>'}</div>
    <div class="row" style="margin-top:10px"><input id="nc-name" placeholder="Add a course e.g. Cheltenham" autocapitalize="words"><button class="btn" id="nc-add" style="margin-top:0;flex:0 0 auto;width:auto;padding:12px 18px">Add</button></div>
    <div class="hint">Removing a course only takes it off the list. Bets already logged keep their course.</div>
  </div>
  <h2>Backup</h2>
  <div class="card">
    <div class="hint" style="margin-top:0">✅ Every change saves instantly on this phone (stored twice for safety).${S.savedAt?` Last saved ${new Date(S.savedAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}.`:''}<br>Last backup file: ${S.lastBackup?new Date(S.lastBackup).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'never'}. Export one every couple of weeks and before changing phones.</div>
    <button class="btn sec" id="exp">Export backup (.json)</button>
    <button class="btn sec" id="csv">Export bets (.csv for Excel)</button>
    <button class="btn sec" id="imp">Import backup</button>
    <input type="file" id="impfile" accept=".json,application/json" class="hidden">
  </div>
  <button class="btn danger" id="wipe">Delete all data</button>`;
}
function bindSettings(){
  const st=S.settings;
  const pv=document.getElementById('s-pv');
  pv.onchange=()=>{const v=Number(pv.value);if(v>0){st.pointValue=v;save();toast('New bets: 1pt = '+money(v)+' · old bets unchanged');render()}else toast('Enter a valid amount')};
  document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{st.pointValue=Number(b.dataset.pv);save();toast('New bets: 1pt = '+money(st.pointValue)+' · old bets unchanged');render()});
  document.querySelectorAll('#s-ew button').forEach(b=>b.onclick=()=>{st.ewMode=b.dataset.v;save();render()});
  document.querySelectorAll('#s-pm button').forEach(b=>b.onclick=()=>{st.ptsMode=b.dataset.v;save();render()});
  document.querySelectorAll('#s-pt button').forEach(b=>b.onclick=()=>{st.placeTerms=b.dataset.v;save();render()});
  const sc=document.getElementById('s-comm');sc.onchange=()=>{const v=num(sc.value);if(v>=0&&v<100){st.commission=v;save();toast('Commission set to '+v+'%')}else toast('Enter a number between 0 and 99')};
  const nc=document.getElementById('nc-name'),addNc=()=>{const c=addCourse(nc.value);if(!c)return toast('Enter a course name');toast(c+' added');render()};
  document.getElementById('nc-add').onclick=addNc;nc.onkeydown=e=>{if(e.key==='Enter')addNc()};
  document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>{const c=b.dataset.delc;if(confirm(`Remove ${c} from your course list?`)){st.courses=st.courses.filter(x=>x!==c);save();render()}});
  draftKey=undefined; // new-bet form picks up changed defaults
  const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  document.getElementById('exp').onclick=()=>{exportBackup();render()};
  document.getElementById('csv').onclick=()=>{
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const rows=[['Date','Bookie','Bet type','Horses','Races','Odds','Leg results','Each way','Place terms','Bets (lines)','Points','Points are','Point value','Stake','Result','Calculated returns','Returns','P/L £','P/L pts','Notes','Lay stake','Commission %']];
    S.bets.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{const st=status(b);rows.push([b.date,bookieName(b.bookieId),typeLabel(b),b.legs.map(l=>l.name).join(' / '),b.legs.map(legRace).join(' / '),b.legs.map(l=>l.odds).join(' / '),b.legs.map(l=>RES_SHORT[l.result]).join(' / '),b.ew?'Yes':'No',b.ew?b.legs.map(l=>l.placeFrac).join(' / '):'',lineCount(b),b.points,lineCount(b)>1?(b.ptsMode==='total'?'Total':'Per line'):'',b.ppv,betStake(b),statusLabel(st,b),calcReturns(b),betReturns(b),betPL(b),r2(betPL(b)/b.ppv),b.notes,isLay(b)?b.layStake:'',isLay(b)?b.comm:''])});
    dl(`bets-${today()}.csv`,rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')};
  const f=document.getElementById('impfile');
  document.getElementById('imp').onclick=()=>f.click();
  f.onchange=()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.settings||!Array.isArray(d.bets))throw 0;
    if(confirm(`Replace current data with this backup (${d.bets.length} bets, ${(d.bookies||[]).length} bookies)?`)){S=normalise(d);save();toast('Backup restored');render()}}catch(e){toast("That file isn't a valid backup")}};rd.readAsText(file)};
  document.getElementById('wipe').onclick=()=>{if(confirm('Delete ALL bets and bookies? This cannot be undone.')&&confirm('Are you sure? Export a backup first if unsure.')){S=normalise(null);save();render();toast('All data cleared')}};
}

init();
</script>
